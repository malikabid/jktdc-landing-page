[www]
; Allow environment variables to be passed from Apache to PHP-FPM
; This is required for Authorization header to work
clear_env = no

; Ensure PHP-FPM can read Authorization header
env[HTTP_AUTHORIZATION] = $HTTP_AUTHORIZATION

; Upload limits. The base PHP image defaults to upload_max_filesize=2M and
; post_max_size=8M, which is far stricter than production (cPanel is set to 32M)
; and below the 10MB the admin upload forms advertise. Without these, document
; uploads over 2MB fail locally with an opaque error while working on the live
; site. Kept at 32M to match production exactly.
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 32M

; Keep warnings out of response bodies. The base image has display_errors on,
; so any notice emitted before/around a JSON response corrupts it and the
; frontend's response.json() throws - which hides the real error from the user.
; Production has display_errors off; this matches it. Errors are still captured
; in the log below, they are just not printed into the payload.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/admin/storage/logs/php-error.log
